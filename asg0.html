<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>Assignment 0 - Vector Library</title>
</head>
<body onload="main()">
    <canvas id="example" width="400" height="400" style="background:black;">
        Please use a browser that supports "canvas"
    </canvas>

    <br><br>

    <!-- V1 and V2 inputs -->
    <label>V1 x: <input type="number" id="v1x" value="2.25"></label>
    <label>V1 y: <input type="number" id="v1y" value="2.25"></label>
    &nbsp;&nbsp;
    <label>V2 x: <input type="number" id="v2x" value="-1"></label>
    <label>V2 y: <input type="number" id="v2y" value="3"></label>
    <input type="button" value="Draw" onclick="handleDrawEvent()">

    <br><br>

    <!-- Operation controls -->
    <select id="operation">
        <option value="add">Add</option>
        <option value="sub">Subtract</option>
        <option value="mul">Multiply</option>
        <option value="div">Divide</option>
        <option value="magnitude">Magnitude</option>
        <option value="normalize">Normalize</option>
        <option value="angle">Angle Between</option>
        <option value="area">Area</option>
    </select>
    <label>Scalar: <input type="number" id="scalar" value="2"></label>
    <input type="button" value="Draw Operation" onclick="handleDrawOperationEvent()">

    <script src="lib/cuon-matrix-cse160.js"></script>
    <script src="asg0.js"></script>
</body>
</html>
